import org.gradle.testing.jacoco.tasks.JacocoReport
import org.gradle.testing.jacoco.tasks.JacocoCoverageVerification

plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.hibernate.orm' version '7.4.5.Final'
//	id 'org.graalvm.buildtools.native' version '1.1.8'
}

group = 'app.sewain'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

ext {
	set('springAiVersion', "2.0.1")
	set('mapstructVersion', "1.6.3")
	set('springModulithVersion', "2.1.1")
}

dependencies {
	def mapstructVersion = project.findProperty('mapstructVersion')
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'commons-io:commons-io:2.22.0'
	implementation 'org.jsoup:jsoup:1.24.1'
	implementation 'io.github.borewit:svg-sanitizer:0.4.0'
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
	compileOnly 'org.projectlombok:lombok'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	developmentOnly 'org.springframework.ai:spring-ai-spring-boot-docker-compose'
	runtimeOnly 'org.springframework.modulith:spring-modulith-runtime'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

hibernate {
	enhancement {
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests against an isolated PostgreSQL 16 Testcontainer.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	maxParallelForks = 1
	systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
	shouldRunAfter tasks.named('test')
}

jacoco {
	toolVersion = '0.8.14'
}

tasks.withType(JacocoReport).configureEach {
	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
}

tasks.named('jacocoTestReport', JacocoReport) {
	description = 'Generates coverage for the default test suite, without Docker.'
	dependsOn tasks.named('test')
	reports {
		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
		xml.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacoco.xml')
	}
}

tasks.register('jacocoIntegrationTestReport', JacocoReport) {
	description = 'Runs PostgreSQL integration tests and generates their coverage report.'
	group = 'verification'
	dependsOn tasks.named('integrationTest')
	sourceSets(project.sourceSets.main)
	executionData(tasks.named('integrationTest').get())
	reports {
		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/integrationTest/html')
		xml.outputLocation = layout.buildDirectory.file('reports/jacoco/integrationTest/jacoco.xml')
	}
}

tasks.register('jacocoCombinedReport', JacocoReport) {
	description = 'Runs both test suites and generates combined backend coverage (requires Docker).'
	group = 'verification'
	dependsOn tasks.named('test'), tasks.named('integrationTest')
	sourceSets(project.sourceSets.main)
	executionData(tasks.named('test').get(), tasks.named('integrationTest').get())
	reports {
		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/combined/html')
		xml.outputLocation = layout.buildDirectory.file('reports/jacoco/combined/jacoco.xml')
	}
}

tasks.named('test') {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('integrationTest') {
	finalizedBy tasks.named('jacocoIntegrationTestReport')
}

// Shared application coverage scope for unit, integration and combined reports.
// Entities contain Hibernate-generated methods and are outside this measurement.
// This is class-level scoping, not a method-level Hibernate filter.
def coverageClasses = sourceSets.main.output.classesDirs.asFileTree.matching {
	include 'app/sewain/**/*Service*.class'
	include 'app/sewain/**/*Calculator*.class'
	include 'app/sewain/**/*Validator*.class'
	include 'app/sewain/**/*Specifications*.class'
	include 'app/sewain/shared/SearchUtils*.class'
	include 'app/sewain/shared/ContentSecurity*.class'
	include 'app/sewain/shared/PageQuery*.class'
	include 'app/sewain/integrations/IntegrationAccess.class'
	include 'app/sewain/integrations/IntegrationSecrets.class'
	include 'app/sewain/integrations/email/EmailTransport*.class'
	include 'app/sewain/integrations/whatsapp/WhatsAppGateway*.class'
	include 'app/sewain/media/RemoteImageImporter*.class'
	include 'app/sewain/media/SafeRasterUpload*.class'
	include 'app/sewain/media/LocalMediaStorage*.class'
	include 'app/sewain/finance/FinanceEventListener*.class'
}

tasks.withType(JacocoReport).configureEach {
	classDirectories.setFrom(coverageClasses)
}

// Opt-in: the existing test/check/build lifecycle does not acquire a new coverage gate.
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
	description = 'Requires 100% line and branch coverage from the default test suite.'
	group = 'verification'
	dependsOn tasks.named('jacocoTestReport')
	sourceSets(project.sourceSets.main)
	classDirectories.setFrom(coverageClasses)
	executionData(tasks.named('test').get())
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 1.0
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 1.0
			}
		}
	}
}
