
spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  application:
    name: sewain.app
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=1h
  datasource:
    url: jdbc:postgresql://localhost:5432/sewain
    username: postgres
    password: Unfaedah!1
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: jackson3
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
app:
  integrations:
    whatsapp:
      base-url: ${WHATSAPP_BASE_URL:http://localhost:3001}
      api-key: ${WHATSAPP_API_KEY:}
      webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:${WHATSAPP_API_KEY:}}
  websocket:
    allowed-origin-patterns: ${APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}
  media:
    storage-path: upload
    base-url: http://localhost:8080

springdoc:
  swagger-ui:
    tagsSorter: alpha
    operationsSorter: method

